<svg xmlns="http://www.w3.org/2000/svg" width="720" height="606" viewBox="0 0 720 606" role="img" aria-label="turn-panel 패널 예시: 요청, 다음 작업, 보고, 바뀐 파일">
<rect width="720" height="606" rx="12" fill="#0d1117"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Apple SD Gothic Neo', 'Noto Sans Mono CJK KR', monospace" font-size="14">
<rect x="20" y="20" width="680" height="93" rx="8" fill="none" stroke="#3d444d" stroke-width="1.5"/>
<text x="38" y="50" text-anchor="start"><tspan fill="#d97757" font-weight="700">요청</tspan></text>
<text x="682" y="50" text-anchor="end"><tspan fill="#3fb950">✓ 완료</tspan><tspan fill="#8b949e"> · 3분 전 · 2분 14초</tspan></text>
<text x="38" y="73" text-anchor="start"><tspan fill="#e6edf3">로그인 화면에서 토큰이 만료되면</tspan></text>
<text x="38" y="96" text-anchor="start"><tspan fill="#e6edf3">앱이 멈추는 버그 고쳐줘</tspan></text>
<rect x="20" y="123" width="680" height="185" rx="8" fill="none" stroke="#3d444d" stroke-width="1.5"/>
<text x="38" y="153" text-anchor="start"><tspan fill="#d97757" font-weight="700">다음 작업</tspan></text>
<text x="38" y="176" text-anchor="start"><tspan fill="#d97757">1</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#e6edf3" font-weight="700">실기기에서 확인</tspan></text>
<text x="59.0" y="199" text-anchor="start"><tspan fill="#8b949e">근거 · 테스트만 돌렸고 실기기는 안 봤다</tspan></text>
<text x="59.0" y="222" text-anchor="start"><tspan fill="#8b949e">보냄 · 시뮬레이터에서 토큰 만료를 확인해줘</tspan></text>
<text x="38" y="245" text-anchor="start"><tspan fill="#d97757">2</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#e6edf3" font-weight="700">커밋하기</tspan></text>
<text x="59.0" y="268" text-anchor="start"><tspan fill="#8b949e">근거 · 고친 파일 2개가 커밋되지 않았다</tspan></text>
<text x="59.0" y="291" text-anchor="start"><tspan fill="#8b949e">보냄 · 토큰 만료 버그 수정을 커밋해줘</tspan></text>
<rect x="20" y="318" width="680" height="116" rx="8" fill="none" stroke="#3d444d" stroke-width="1.5"/>
<text x="38" y="348" text-anchor="start"><tspan fill="#d97757" font-weight="700">보고</tspan></text>
<text x="38" y="371" text-anchor="start"><tspan fill="#e6edf3">토큰 만료 시 앱이 멈추는 문제를 고쳤습니다.</tspan></text>
<text x="38" y="394" text-anchor="start"><tspan fill="#e6edf3">- 원인: 재발급이 끝나기 전에 화면이 다시 그려졌다</tspan></text>
<text x="38" y="417" text-anchor="start"><tspan fill="#e6edf3">- 관련: </tspan><tspan fill="#58a6ff" text-decoration="underline">#1234</tspan></text>
<rect x="20" y="444" width="680" height="93" rx="8" fill="none" stroke="#3d444d" stroke-width="1.5"/>
<text x="38" y="474" text-anchor="start"><tspan fill="#d97757" font-weight="700">바뀐 파일 (2)</tspan></text>
<text x="38" y="497" text-anchor="start"><tspan fill="#e6edf3">src/auth/authClient.ts</tspan></text>
<text x="38" y="520" text-anchor="start"><tspan fill="#e6edf3">src/auth/queue.ts</tspan></text>
<text x="208" y="520" text-anchor="start"><tspan fill="#8b949e">새 파일</tspan></text>
<text x="24" y="565" text-anchor="start"><tspan fill="#8b949e">턴 5/5</tspan></text>
<text x="100" y="565" text-anchor="start"><tspan fill="#d97757">p</tspan><tspan fill="#8b949e">: 이전</tspan></text>
<text x="180" y="565" text-anchor="start"><tspan fill="#d97757">n</tspan><tspan fill="#8b949e">: 다음</tspan></text>
<text x="260" y="565" text-anchor="start"><tspan fill="#d97757">e</tspan><tspan fill="#8b949e">: 고쳐서 보내기</tspan></text>
<text x="24" y="588" text-anchor="start"><tspan fill="#8b949e">1~3 제안 보내기 · Tab 링크·파일 · Esc 입력란</tspan></text>
</g>
